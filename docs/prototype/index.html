function per(size){const m=/([\d.,]+)\s*(kg|g|ml|l)\b/i.exec(size||"");if(!m)return null;

function recommend(itemId,st){

    if(st&&s!==st) continue; if(!buyable(p,o)) continue;
    const k=[p.tag==="pref"?0:1,unitVal(p,o.price)];
    if(!best||k[0]<best.k[0]||(k[0]===best.k[0]&&k[1]<best.k[1])) best={p,o,store:s,k}}

  return `Preferred: ${name}`}

/* Usual rhythm (spec: Recommendations): median days between purchase days, needs 3;

const dayNo=t=>{const d=new Date(t);return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)};
function rhythmOf(itemId){
  const ts=[]; [...S.log].sort((a,b)=>a.t-b.t).forEach(l=>{if(l.item!==itemId)return;
    if(l.type==="bought") ts.push(l.t); else if(l.detail==="undo bought") ts.pop()});
  const days=[...new Set(ts.map(dayNo))].sort((a,b)=>a-b); if(days.length<3) return null;
  const g=days.slice(1).map((d,k)=>d-days[k]).sort((a,b)=>a-b), m=g.length>>1, every=g.length%2?g[m]:(g[m-1]+g[m])/2;
  const since=dayNo(Date.now())-days[days.length-1];

/* Store filter: here / avoid ("Better elsewhere") / elsewhere (hidden behind "N more"). */
function verdict(e,st){
  if(!e.item){const own=eStore(e); return !own||own===st?{k:"here"}:{k:"elsewhere"}}
  const pp=eprod(e);
  if(pp){const o=pp.offers[st]; if(!o) return {k:"elsewhere"};
    if(o.avoid||pp.tag==="avoid") return {k:"avoid",why:o.why||pp.why||"Not at this store"}; return {k:"here"}}
  const i=item(e.item), r=i.rules[st];
  if(r&&r.r==="avoid") return {k:"avoid",why:r.why||"Not at this store"};
  const ps=prods(i.id), at=ps.filter(p=>p.offers[st]), ok=at.filter(p=>buyable(p,p.offers[st]));
  if(at.length&&!ok.length){const w=at.length===1&&at[0].offers[st].why; return {k:"avoid",why:w||"Only don't-buy products here"}}
  if((r&&r.r==="pref")||ok.length) return {k:"here"};

/* With All: stores the entry is known at; green+bold = sells a preferred product (or cheapest, for a specific product). */
function storesFor(e){
  const out=new Map(), pp=eprod(e);
  if(eStore(e)) out.set(eStore(e),true);
  else if(pp){const os=offers(pp).filter(([,o])=>!o.avoid), priced=os.filter(([,o])=>o.price!=null);
    const min=Math.min(...priced.map(([,o])=>unitVal(pp,o.price)));
    os.forEach(([s,o])=>out.set(s,o.price!=null&&priced.length>1&&unitVal(pp,o.price)===min))}
  else if(e.item){const i=item(e.item); pref(i).forEach(s=>out.set(s,false));
    prods(i.id).forEach(p=>{if(p.tag==="avoid")return; offers(p).forEach(([s,o])=>{if(!o.avoid) out.set(s,out.get(s)||p.tag==="pref")})})}

/* Stores by use: items bought there (Buy here, or a product sold there), most first; ties keep the store order. */
function storesByUse(first){

  S.items.forEach(i=>pref(i).forEach(st=>add(st,i.id)));
  S.products.forEach(p=>offers(p).forEach(([st,o])=>{if(!o.avoid) add(st,p.item)}));
  const c=st=>(n.get(st)||new Set()).size, all=stores();
  const o=all.map((st,i)=>[st,i]).sort((a,b)=>c(b[0])-c(a[0])||a[1]-b[1]).map(x=>x[0]);

/* Clear stores: Buy here, a preferred product sold there, the specific product's stores, a one-off's store; never Not here. None = "Other". */
function clearStores(e){

  if(pp){if(pp.tag!=="avoid") offers(pp).forEach(([s,o])=>{if(!o.avoid) out.add(s)}); return out}

  openE.forEach(e=>clearStores(e).forEach(s=>{if(verdict(e,s).k==="here") busy.add(s)}));
  const chipStores=stores().filter(s=>busy.has(s)||s===store), nOther=openE.filter(e=>!clear(e)).length;
  if(other&&!nOther) other=false;
  let here=openE, maybe=[], avoid=[], elsewhere=0;
  if(other){here=openE.filter(e=>!clear(e)); elsewhere=openE.length-here.length}
  else if(store!=="All"){here=[];openE.forEach(e=>{const v=verdict(e,store);v.k==="here"?(clear(e)?here:maybe).push(e):v.k==="avoid"?avoid.push([e,v.why]):elsewhere++});maybe.sort((a,b)=>ename(a).localeCompare(ename(b)))}
  const groups=[...S.cats,"Other"].map(c=>[c,here.filter(e=>catOf(e.item&&item(e.item))===c).sort((a,b)=>ename(a).localeCompare(ename(b)))]).filter(([,es])=>es.length);
  $("#view").innerHTML=`
  <div class="search"><input id="q" placeholder="Add item, e.g. milk" autocomplete="off" value="${esc(query)}" aria-label="Add item"><div id="sugg"></div></div>
  <div><p class="label">Shopping at</p><div class="chips">${["All",...chipStores].map(s=>`<button class="chip" data-store="${esc(s)}" aria-pressed="${s===store&&!other}">${esc(s)}</button>`).join("")}${nOther?`<button class="chip" data-other="1" aria-pressed="${other}">Other</button>`:""}</div></div>
  ${usual.length||low.length?`<div><p class="label">Suggestions${store!=="All"?" for "+esc(store):""}</p><div class="strip">
    ${usual.map(({i,r})=>`<span class="pill2"><button data-add="${i.id}">+ ${esc(i.name)} <small>· usually ${everyStr(r.every)}</small></button><button class="x2" data-dismiss="${i.id}" aria-label="Not today: ${esc(i.name)}">×</button></span>`).join("")}
    ${low.map(i=>`<span class="pill2 low"><button data-add="${i.id}">+ ${esc(i.name)} <small>· ${i.stock==="out"?"out":"low"} at home</small></button><button class="x2" data-dismiss="${i.id}" aria-label="Not today: ${esc(i.name)}">×</button></span>`).join("")}
  </div></div>`:""}
  ${groups.length?groups.map(([c,es])=>`<section class="group"><h3>${esc(c)}</h3>${es.map(e=>entryRow(e)).join("")}</section>`).join(""):maybe.length?"":`<div class="empty">${store!=="All"?"Nothing to buy at "+esc(store)+".":openE.length?"":"The list is empty."} Type above to add an item.</div>`}
  ${maybe.length?`<section class="group maybe"><h3>Other · no clear store</h3>${maybe.map(e=>entryRow(e)).join("")}</section>`:""}
  ${avoid.length?`<section class="group warn"><h3>Better elsewhere</h3>${avoid.map(([e,w])=>entryRow(e,w)).join("")}</section>`:""}
  ${elsewhere?`<button class="ghost" data-store="All">${elsewhere} more ${elsewhere>1?"items are":"item is"} for other stores. Show all</button>`:""}
  ${cart.length?`<section class="group"><h3>In the cart · ${cart.length}</h3>${cart.map(e=>entryRow(e)).join("")}</section><button class="ghost" id="clear">Clear cart</button>`:""}
  <p class="foot">Example data stored only in this browser. <button class="ghost" id="reset">Reset demo</button></p>`;
  const q=$("#q"); q.addEventListener("input",()=>{query=q.value;drawSugg()}); drawSugg();
}
function drawSugg(){

function move(kind,k,d){const a=kind==="store"?S.stores:S.cats, j=k+d; if(j<0||j>=a.length) return; [a[k],a[j]]=[a[j],a[k]]; save(); render()}
function renameStore(from,to){
  S.items.forEach(i=>{if(i.rules[from]){i.rules[to]=i.rules[from];delete i.rules[from]}});
  S.products.forEach(p=>{if(p.offers[from]){p.offers[to]=p.offers[from];delete p.offers[from]}});
  S.list.forEach(e=>{if(e.store===from) e.store=to});
  if(store===from) store=to}
/* back(name|null): return to the sheet that opened it (entry / item sheet "+ New store"). */
function placeSheet(kind,k,back){
  const isNew=k==="new", isStore=kind==="store", rec=isNew?null:(isStore?S.stores[k]:{name:S.cats[k]});
  const what=isStore?"store":"category"; let confirm=false;
  const nRules=rec&&isStore?S.items.filter(i=>i.rules[rec.name]).length:0, nOffers=rec&&isStore?S.products.filter(p=>p.offers[rec.name]).length:0;
  const nItems=rec&&!isStore?S.items.filter(i=>i.cat===rec.name).length:0;
  const warn=isStore?`Deletes ${esc(rec&&rec.name)}${nRules?`, ${nRules} item rule${nRules>1?"s":""} (Buy here / Not here)`:""}${nOffers?` and ${nOffers} product price${nOffers>1?"s":""}`:""}.`
    :`Deletes ${esc(rec&&rec.name)}.${nItems?` Its ${nItems} item${nItems>1?"s":""} move to “Other”.`:""}`;
  sheet(`<h2 id="sh">${isNew?"New "+what:"Edit "+what}</h2>
    <div class="field"><label for="pl-name">Name</label><input id="pl-name" value="${esc(rec?rec.name:"")}" autocomplete="off"></div>
    ${isStore?`<div class="field"><label for="pl-type">Type <span style="font-weight:400">(optional, e.g. supermarket)</span></label><input id="pl-type" value="${esc(rec?rec.type:"")}" autocomplete="off"></div>`:""}
    <p class="err" id="pl-err" role="alert" hidden></p>
    <p class="meta" id="pl-warn" role="alert" hidden>${warn}</p>
    <div class="actions">${isNew?"":`<button class="btn danger" data-a="del">Delete</button><span class="spacer"></span>`}<button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">${isNew?"Add":"Save"}</button></div>`,
  (a,el)=>{
    if(a==="cancel"){back?back(null):close();return}
    if(a==="del"){
      if(!confirm){confirm=true;$("#pl-warn").hidden=false;el.textContent="Tap again to delete";return}
      if(isStore){const n=rec.name;S.stores.splice(k,1);S.items.forEach(i=>delete i.rules[n]);S.products.forEach(p=>delete p.offers[n]);if(store===n)store="All";log("edited",{text:n},{detail:"store deleted",place:1})}
      else{S.cats.splice(k,1);log("edited",{text:rec.name},{detail:"category deleted",place:1})}
      save();close();toast(`Deleted ${rec.name}`);render();return}
    if(a==="save"){
      const name=$("#pl-name").value.trim(), err=$("#pl-err");
      if(!name){$("#pl-name").focus();return}
      const names=isStore?stores():S.cats;
      if(names.some((n,j)=>norm(n)===norm(name)&&(isNew||j!==k))){err.textContent=`There is already a ${what} called ${names.find(n=>norm(n)===norm(name))}.`;err.hidden=false;return}
      if(isStore){const type=$("#pl-type").value.trim();
        if(isNew){S.stores.push({name,type});log("created",{text:name},{detail:"store",place:1})}
        else{if(rec.name!==name) renameStore(rec.name,name); rec.name=name; rec.type=type; log("edited",{text:name},{detail:"store",place:1})}}
      else{ if(isNew){S.cats.push(name);log("created",{text:name},{detail:"category",place:1})}
        else{const old=S.cats[k]; S.cats[k]=name; S.items.forEach(i=>{if(i.cat===old)i.cat=name}); log("edited",{text:name},{detail:"category",place:1})}}
      save();toast(isNew?`Added ${name}`:"Saved");if(back&&isNew){back(name);render();return}close();render()}
  },()=>$("#pl-name").focus());
}

function sheet(html,handler,after){
  $("#overlay").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">${html}</div></div>`;
  $("#scrim").addEventListener("click",ev=>{

  after&&after();
}

function tagBadge(p){return p.tag==="pref"?'<span class="badge">Preferred</span>':p.tag==="avoid"?`<span class="badge warn">Don't buy${p.why?": "+esc(p.why):""}</span>`:""}

function priceTable(i,hl){
  const ps=prods(i.id); if(!ps.length) return `<p class="meta">No products or prices saved for ${esc(i.name)} yet.</p>`;
  const sts=stores().filter(s=>ps.some(p=>p.offers[s]));
  if(!sts.length) return `<p class="meta">No stores saved for these products yet.</p>`;
  let min=Infinity; ps.forEach(p=>sts.forEach(s=>{const o=p.offers[s]; if(o&&!avoidHere(p,s)) min=Math.min(min,unitVal(p,o.price))}));
  return `<div class="tw"><table class="pt"><thead><tr><th>Product</th>${sts.map(s=>`<th class="${s===hl?"hl":""}">${esc(s)}</th>`).join("")}</tr></thead><tbody>
  ${ps.map(p=>`<tr><th scope="row"><div>${esc(p.name)}</div><div class="meta">${esc(p.size||"")} ${tagBadge(p)}</div></th>${sts.map(s=>{const o=p.offers[s];
    if(!o) return `<td class="${s===hl?"hl":""}"><span class="up">–</span></td>`;
    const av=avoidHere(p,s), best=!av&&o.price!=null&&Math.abs(unitVal(p,o.price)-min)<1e-9;
    return `<td class="${s===hl?"hl":""} ${av?"av":""} ${best?"best":""}"><div class="pr">${o.price!=null?eur(o.price):o.avoid?"":"sold"}</div><div class="up">${unitStr(p,o.price)}</div>${o.price!=null?`<div class="up">${fmtDay(o.t)}</div>`:""}${o.avoid?`<div class="avw">${esc(o.why||"Not here")}</div>`:""}</td>`}).join("")}</tr>`).join("")}
  </tbody></table></div><p class="meta">Bold green = cheapest per kg / l (or per pack) among products you'd buy. Struck through = don't buy.</p>`}

    else if(a==="inc"){draft.qty++;$("#es-qty").textContent=draft.qty}
    else if(a==="newstore"){keep();placeSheet("store","new",n=>{if(n){e.store=n;log("edited",e,{detail:"buy at "+n});save()}entrySheet(e)})}
    else if(a.startsWith("at:")){keep();const st=a.slice(3);if((e.store||"")!==st){if(st)e.store=st;else delete e.store;log("edited",e,{detail:st?"buy at "+st:"any store"});save()}entrySheet(e);render()}
    else if(a.startsWith("pick:")){keep();const t=setEntryProduct(e,+a.slice(5));entrySheet(t);render()}
    else if(a==="close"){keep();close();render()}
    else if(a==="nn"){close();notNeeded(e)}
    else if(a==="prods"){keep();productsSheet(i,()=>entrySheet(e))}
    else if(a==="keep"){keep();itemSheet(null,{name:e.text,convert:e.id})}
    else if(a==="buy"){keep();const extra={};
      if(i){const st=$("#es-store").value,pid=+$("#es-prod").value||0,pr=parseFloat($("#es-price").value.replace(",","."));
        extra.store=st; if(pid) extra.product=pid;
        if(!isNaN(pr)&&pr>0){extra.price=pr; if(pid){const p=prod(pid);p.offers[st]={...(p.offers[st]||{}),price:pr,t:Date.now(),avoid:false}}}}
      else if(store!=="All") extra.store=store;
      close();buy(e,extra);toast(`Bought ${ename(e)}`)}
  },
  ()=>{ if(!i) return;
    const sync=()=>{const st=$("#es-store").value,pid=+$("#es-prod").value,p=pid&&prod(pid),o=p&&p.offers[st];$("#es-price").placeholder=o&&o.price!=null?o.price.toFixed(2):"–"};
    $("#es-prod").value=defProd(st0); sync();
    $("#es-store").addEventListener("change",()=>{$("#es-prod").value=defProd($("#es-store").value);sync()});
    $("#es-prod").addEventListener("change",sync);
  });
}

function itemSheet(i,opt={}){
  const isNew=!i; const d=opt.draft||(i?JSON.parse(JSON.stringify(i)):{name:opt.name||"",aliases:"",cat:S.cats[0]||"",qty:1,unit:"",track:false,stock:"ok",restock:"out",rules:{}});
  d.restock=d.restock||"out";
  const np=i?prods(i.id).length:0;
  sheet(`<h2 id="sh">${isNew?"New item":"Edit item"}</h2>
    <div class="field"><label for="f-name">Name</label><input id="f-name" value="${esc(d.name)}"></div>
    <div class="field"><label for="f-alias">Other names <span style="font-weight:400">(comma-separated, for search)</span></label><input id="f-alias" value="${esc(d.aliases||"")}" placeholder="e.g. Waschmittel"></div>
    <div class="qty-row">
      <div class="field" style="flex:1"><label for="f-cat">Category</label><select id="f-cat"><option value="">Other</option>${S.cats.map(c=>`<option ${c===d.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="f-qty">Usually</label><div class="inline2"><input id="f-qty" type="number" min="1" step="any" value="${d.qty||1}" aria-label="Default quantity"><select id="f-unit" aria-label="Default unit">${UNITS.map(u=>`<option value="${u==="piece"?"":u}" ${(d.unit||"")===(u==="piece"?"":u)?"selected":""}>${u}</option>`).join("")}</select></div></div>
    </div>
    <label class="toggle"><input type="checkbox" id="f-track" ${d.track?"checked":""}> Keep in stock at home</label>
    <div class="toggle" id="f-restock" ${d.track?"":"hidden"}><span class="meta">Put on the list when it's</span><div class="seg" role="group" aria-label="Put on the list when">
      <button data-a="rs:low" class="lo" aria-pressed="${d.restock==="low"}">Low</button><button data-a="rs:out" class="out" aria-pressed="${d.restock==="out"}">Out</button></div></div>
    <section><p class="label" style="margin:0">Where to buy</p><div class="rules">${(pk=>pk.order.map(s=>{const k=stores().indexOf(s),r=d.rules[s]||{};return `
      <div class="rule" ${pk.hidden(s)?"data-extra hidden":""}><span>${esc(s)}</span><div class="seg"><button data-a="r:${k}:" aria-pressed="${!r.r}" class="neutral">–</button><button data-a="r:${k}:pref" class="ok" aria-pressed="${r.r==="pref"}">Buy here</button><button data-a="r:${k}:avoid" class="out" aria-pressed="${r.r==="avoid"}">Not here</button></div>
      <input class="why" id="f-why-${k}" placeholder="Why not here?" value="${esc(r.why||"")}" ${r.r==="avoid"?"":"hidden"}></div>`}).join("")+`</div>${moreBtn(pk)}`)(picker(Object.keys(d.rules)))}<button class="chip add" data-a="newstore">+ New store</button></section>
    ${isNew?`<p class="meta">Products and prices can be added after saving.</p>`:`<button class="ghost" data-a="prods">Products and prices (${np})</button>`}
    <div class="actions"><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">${isNew?(opt.convert?"Save item":"Save and add to list"):"Save"}</button></div>`,
  (a,el)=>{
    if(a==="cancel"){close();render();return}
    if(a.startsWith("rs:")){d.restock=a.slice(3);el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));return}
    if(a.startsWith("r:")){const[,k,v]=a.split(":");const s=stores()[k];
      if(v) d.rules[s]={r:v,why:(d.rules[s]||{}).why}; else delete d.rules[s];
      el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));
      $("#f-why-"+k).hidden=v!=="avoid"; return}
    const collect=()=>{
      stores().forEach((s,k)=>{if(d.rules[s]&&d.rules[s].r==="avoid") d.rules[s].why=$("#f-why-"+k).value.trim()});
      d.name=$("#f-name").value.trim(); d.aliases=$("#f-alias").value.split(",").map(x=>x.trim()).filter(Boolean).join(", ");
      d.cat=$("#f-cat").value; d.qty=parseFloat($("#f-qty").value)||1; d.unit=$("#f-unit").value; d.track=$("#f-track").checked};
    if(a==="newstore"){collect();placeSheet("store","new",n=>{if(n) d.rules[n]={r:"pref"};itemSheet(i,{...opt,draft:d})});return}
    if(a==="save"||a==="prods"){
      collect(); const name=d.name; if(!name){$("#f-name").focus();return}
      if(isNew){d.id=nid(); S.items.push(d); log("created",{item:d.id}); query="";
        if(opt.convert){const e=entry(opt.convert); if(e){e.item=d.id; delete e.text; delete e.store;} save(); close(); toast(`Saved ${d.name} as an item`); render(); return}
        close(); tab="list"; addItem(d.id); return}
      Object.assign(i,d); log("edited",{item:i.id}); save();
      if(a==="prods"){productsSheet(i,()=>itemSheet(i));return}
      close(); toast("Saved"); render();
    }
  },()=>{$("#f-name").focus();$("#f-track").addEventListener("change",ev=>{$("#f-restock").hidden=!ev.target.checked})});
}

function productsSheet(i,back){
  const ps=prods(i.id), best=recommend(i.id,store!=="All"?store:"");
  sheet(`<h2 id="sh">${esc(i.name)}: products</h2>
    <p class="meta">Specific products that count as “${esc(i.name)}”. Mark the good ones as preferred and the ones to skip as don't buy. Per store: sold here (price optional) or not here.</p>
    ${ps.length?ps.map(p=>`<div class="prodrow ${best&&best.p.id===p.id?"best":""}">${p.photo?`<img class="thumb" src="${p.photo}" alt="">`:""}<div class="pmain"><div class="name">${esc(p.name)} <span class="x">${esc(p.size||"")}</span></div>
      <div class="meta">${tagBadge(p)} ${best&&best.p.id===p.id?'<span class="badge plain">recommended</span>':""} ${offers(p).map(([s,o])=>`<span${o.avoid?' style="color:var(--out)"':""}>${esc(s)}${o.avoid?" (not here)":o.price!=null?" "+eur(o.price):""}</span>`).join(" · ")||"no stores yet"}</div></div>
      <button class="btn" data-a="edit:${p.id}">Edit</button></div>`).join(""):`<p class="empty">No specific products yet. Add the ones you like (or don't) so everyone knows what to grab.</p>`}
    <div class="actions"><button class="btn" data-a="add">+ Add product</button><span class="spacer"></span><button class="btn primary" data-a="done">Done</button></div>`,
  (a)=>{
    if(a==="done"){back?back():(close(),render())}
    else if(a==="add") productSheet(i,null,()=>productsSheet(i,back));
    else if(a.startsWith("edit:")) productSheet(i,prod(+a.slice(5)),()=>productsSheet(i,back));
  });
}

/* Per store: – / Sold here (price optional) / Not here (+ reason). Added while shopping, the current store starts as "Sold here". */
function productSheet(i,p,back){
  const isNew=!p; const d=p?JSON.parse(JSON.stringify(p)):{item:i.id,name:"",size:"",tag:"ok",why:"",offers:{}};
  if(isNew&&store!=="All") d.offers[store]={price:null};
  const st=s=>!d.offers[s]?"":d.offers[s].avoid?"not":"here";
  const pk=picker(Object.keys(d.offers),store!=="All"?store:""), order=pk.order;
  let confirm=false;
  sheet(`<h2 id="sh">${isNew?"New product":"Edit product"}</h2>
    <p class="meta">Counts as <b>${esc(i.name)}</b></p>
    <div class="field"><label for="p-name">Brand and name</label><input id="p-name" value="${esc(d.name)}" placeholder="e.g. Lavazza Crema e Aroma"></div>
    <div class="field"><label for="p-size">Pack size <span style="font-weight:400">(for comparing prices)</span></label><input id="p-size" value="${esc(d.size)}" placeholder="e.g. 1 kg, 300 ml, 60 tabs"></div>
    <section><p class="label" style="margin:0">Photo <span style="text-transform:none;letter-spacing:0;font-weight:400">(so everyone grabs the right pack)</span></p>
      <div class="photorow"><span id="p-ph">${d.photo?`<img class="pphoto" src="${d.photo}" alt="Product photo">`:'<span class="pphoto none">No photo</span>'}</span>
        <div class="photoact"><label class="btn">${d.photo?"Change photo":"Add photo"}<input type="file" id="p-file" accept="image/*" hidden></label>
        <button class="btn danger" data-a="nophoto" ${d.photo?"":"hidden"}>Remove photo</button></div></div></section>
    <section><p class="label" style="margin:0">Verdict</p>
      <div class="seg" style="align-self:flex-start"><button data-a="tag:pref" class="ok" aria-pressed="${d.tag==="pref"}">Preferred</button><button data-a="tag:ok" class="neutral" aria-pressed="${d.tag==="ok"}">OK</button><button data-a="tag:avoid" class="out" aria-pressed="${d.tag==="avoid"}">Don't buy</button></div>
      <div class="field"><input id="p-why" placeholder="Why not? e.g. tastes stale" value="${esc(d.why||"")}" aria-label="Why not" ${d.tag==="avoid"?"":"hidden"}></div></section>
    <section><p class="label" style="margin:0">Where you get it</p><div class="rules">${order.map(s=>{const k=stores().indexOf(s),o=d.offers[s]||{},xh=pk.hidden(s)?"data-extra hidden":"";return `
      <div class="rule" ${xh}><span>${esc(s)}${s===store?' <span class="badge plain">you\'re here</span>':""}${o.t&&o.price!=null?`<div class="meta">${eur(o.price)} seen ${fmtDay(o.t)}</div>`:""}</span>
      <div class="seg" role="group" aria-label="${esc(s)}"><button data-a="st:${k}:" class="neutral" aria-pressed="${st(s)===""}">–</button><button data-a="st:${k}:here" class="ok" aria-pressed="${st(s)==="here"}">Sold here</button><button data-a="st:${k}:not" class="out" aria-pressed="${st(s)==="not"}">Not here</button></div>
      <input class="why" id="p-pr-${k}" inputmode="decimal" placeholder="Price in € (optional)" aria-label="Price at ${esc(s)}" value="${o.price!=null&&!o.avoid?o.price.toFixed(2).replace(".",","):""}" ${st(s)==="here"?"":"hidden"}>
      <input class="why" id="p-sw-${k}" placeholder="Why not here? e.g. too pricey" aria-label="Why not at ${esc(s)}" value="${esc(o.why||"")}" ${st(s)==="not"?"":"hidden"}></div>`}).join("")}</div>${moreBtn(pk)}</section>
    <p class="meta" id="p-del" role="alert" hidden>Deletes this product and its prices.</p>
    <div class="actions">${isNew?"":`<button class="btn danger" data-a="del">Delete</button>`}<span class="spacer"></span><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">${isNew?"Add product":"Save"}</button></div>`,
  (a,el)=>{
    if(a==="cancel"){back();return}
    if(a==="nophoto"){d.photo="";$("#p-ph").innerHTML='<span class="pphoto none">No photo</span>';el.hidden=true;return}
    if(a.startsWith("tag:")){d.tag=a.slice(4);el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));$("#p-why").hidden=d.tag!=="avoid";return}
    if(a.startsWith("st:")){const[,k,v]=a.split(":");const s=stores()[k];
      if(!v) delete d.offers[s]; else d.offers[s]={...(d.offers[s]||{price:null}),avoid:v==="not"};
      el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));
      $("#p-pr-"+k).hidden=v!=="here"; $("#p-sw-"+k).hidden=v!=="not"; return}
    if(a==="del"){if(!confirm){confirm=true;$("#p-del").hidden=false;el.textContent="Tap again to delete";return}
      S.products=S.products.filter(x=>x.id!==p.id);S.list.forEach(e=>{if(e.product===p.id) delete e.product});save();toast(`Deleted ${p.name}`);back();return}
    if(a==="save"){
      const name=$("#p-name").value.trim(); if(!name){$("#p-name").focus();return}
      if(prods(i.id).some(x=>norm(x.name)===norm(name)&&(!p||x.id!==p.id))){toast(`${i.name} already has a product called ${name}`);return}
      d.name=name; d.size=$("#p-size").value.trim(); d.why=d.tag==="avoid"?$("#p-why").value.trim():"";
      const out={};
      stores().forEach((s,k)=>{const o=d.offers[s]; if(!o) return; const old=(p&&p.offers[s])||{};
        if(o.avoid){out[s]={price:old.price??null,t:old.t,avoid:true,why:$("#p-sw-"+k).value.trim()};return}
        const pr=parseFloat($("#p-pr-"+k).value.trim().replace(",",".")), price=isNaN(pr)||pr<=0?null:Math.round(pr*100)/100;
        out[s]={price,t:price!=null&&price!==old.price?Date.now():old.t}});
      d.offers=out;
      if(isNew){d.id=nid();S.products.push(d)} else Object.assign(p,d);
      log(isNew?"created":"edited",{item:i.id},{detail:"product: "+name});
      save(); toast(isNew?`Added ${name} to ${i.name}`:"Saved"); back();
    }
  },()=>{if(isNew)$("#p-name").focus();
    $("#p-file").addEventListener("change",ev=>{const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
      shrink(f,480).then(url=>{d.photo=url;$("#p-ph").innerHTML=`<img class="pphoto" src="${url}" alt="Product photo">`;$('[data-a="nophoto"]').hidden=false})
        .catch(()=>toast("Couldn't read this photo"))})});
}

/* ---------- global events ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b||b.closest("#overlay")) return;
  const ds=b.dataset;
  if(ds.tab){tab=ds.tab;query="";render();scrollTo(0,0)}
  else if(ds.user){if(ds.user===S.user) accountSheet(); else {S.user=ds.user;save();render();toast(`Demo: now acting as ${S.user}`)}}
  else if(ds.store){store=ds.store;other=false;render()}
  else if(ds.other){store="All";other=true;render()}
  else if(ds.add){addItem(+ds.add)}
  else if(ds.dismiss){dismiss(+ds.dismiss)}
  else if(ds.pick){query="";addItem(+ds.pick)}
  else if(ds.pickp){query="";const p=prod(+ds.pickp);addItem(p.item,{product:p.id})}
  else if(ds.once){const t=query.trim();query="";addOnce(t)}
  else if(ds.new){itemSheet(null,{name:query.trim()})}
  else if(ds.entry){entrySheet(entry(+ds.entry))}
  else if(ds.buy){const e=entry(+ds.buy);buy(e,store!=="All"?{store}:{});toast(`Bought ${ename(e)}. Tap the name to record a price`)}
  else if(ds.undo){const e=entry(+ds.undo);e.state="open";log("edited",e,{detail:"undo bought"});save();render()}
  else if(ds.stock){const[id,v]=ds.stock.split(":");setStock(item(+id),v)}
  else if(ds.edit){itemSheet(item(+ds.edit))}
  else if(ds.place){const[k,v]=ds.place.split(":");placeSheet(k,v==="new"?"new":+v)}
  else if(ds.move){const[k,i,d]=ds.move.split(":");move(k,+i,+d)}
  else if(b.id==="clear"){S.list=S.list.filter(e=>e.state!=="bought");save();render()}
  else if(b.id==="reset"){S=SEED();store="All";save();render();toast("Demo reset")}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="q"){const t=query.trim();if(!t)return;
    const m=byName(t), ps=searchProducts(t,search(t)), xp=ps.find(p=>norm(p.name)===norm(t));
    query="";
    if(m) addItem(m.id); else if(xp) addItem(xp.item,{product:xp.id}); else addOnce(t)}
  if(ev.key==="Escape"&&$("#overlay").innerHTML){close();render()}
});
render();
</script>

</body></html>
